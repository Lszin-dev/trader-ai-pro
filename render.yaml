services:
  - type: worker
    name: trader-ai-pro-monitor
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python worker.py
    autoDeploy: false
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: OTCHARTS_API_KEY
        sync: false
      - key: OTCHARTS_VENUE
        value: iq
      - key: OTCHARTS_MAX_SYMBOLS
        value: "5"
      - key: SCAN_INTERVAL_SECONDS
        value: "65"
      - key: LOG_LEVEL
        value: INFO
