name: TRADER AI PRO tests

on:
  push:
    branches:
      - development/automation-ai-foundation
  pull_request:
    branches:
      - main
      - development/automation-ai-foundation

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pandas numpy requests "streamlit>=1.37" supabase
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
